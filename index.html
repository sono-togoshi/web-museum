
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>びじゅつかん</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

#shop {
    width: 1000px;
    height: 500px;
    position: relative;
    overflow: hidden;
    background-image: url("background/museum-background.png");
    background-size: 100% 100%;
    background-position: center;
}


.gallery {
    position: absolute;
    left: 6%;
    top: 32%;
    width: 88%;
    height: 42%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(3, 1fr);
    column-gap: 3%;
    row-gap: 12%;
}

.gallery img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

#drawButton {
    position: absolute;
    right: 12px;
    bottom: 12px;
    z-index: 10;
    padding: 10px 16px;
    border: 2px solid white;
    border-radius: 20px;
    background: #e879a9;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="shop">

<div class="gallery" id="gallery"></div>

    <button id="drawButton"
        onclick="location.href='draw.html'">
        えをかく
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://yapohmzbgojtaygfceel.supabase.co";

const SUPABASE_KEY = "sb_publishable_LzzA7XlGG4Q6qGQDpf8_mA_FZepVODX";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function loadArts() {

    const { data, error } = await supabaseClient
        .from("art")
        .select("slot,image_path")
        .order("slot");

    if (error) {
        console.error("かいがの読み込みエラー:", error);
        return;
    }

    const gallery = document.getElementById("gallery");
gallery.innerHTML = "";

data.forEach(item => {
    const art = document.createElement("img");
    art.src =
        SUPABASE_URL +
        "/storage/v1/object/public/art-images/" +
        item.image_path;
    art.alt = "かいが";
    art.onerror = function() {
        console.error("画像を読み込めません:", art.src);
    };
    gallery.appendChild(art);
});


}

loadArts();

</script>

</body>
</html>
