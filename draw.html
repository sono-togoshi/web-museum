
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かいがをかく</title>

<style>
body {
    text-align: center;
    font-family: sans-serif;
    background: #f5f0e8;
}

canvas {
    width: 500px;
    height: 350px;
    max-width: 95%;
    border: 1px solid #8b633d;
    touch-action: none;
}

.color {
    width: 50px;
    height: 50px;
    margin: 5px;
    border: 2px solid black;
}

button {
    cursor: pointer;
}

#status {
    min-height: 1.5em;
}
</style>
</head>

<body>

<h1>かいがをかく</h1>

<div style="display:flex; flex-wrap:nowrap; gap:4px; width:50%;margin:auto;">

<button class="color" style="background:#FFFFFF; flex:1; min-width:0; height:30px; padding:0;"
onclick="setColor('#FFFFFF')"></button>

<button class="color" style="background:#FF0000; flex:1; min-width:0; height:30px; padding:0;"
onclick="setColor('#FF0000')"></button>

<button class="color" style="background:#FF69B4; flex:1; min-width:0; height:30px; padding:0;"
onclick="setColor('#FF69B4')"></button>

<button class="color" style="background:#FF8C00; flex:1; min-width:0; height:30px; padding:0;"
onclick="setColor('#FF8C00')"></button>

<button class="color" style="background:#FFD700; flex:1; min-width:0; height:30px; padding:0;"
onclick="setColor('#FFD700')"></button>

<button class="color" style="background:#9ACD32; flex:1; min-width:0; height:30px; padding:0;"
onclick="setColor('#9ACD32')"></button>

<button class="color" style="background:#008000; flex:1; min-width:0; height:30px; padding:0;"
onclick="setColor('#008000')"></button>

<button class="color" style="background:#0000FF; flex:1; min-width:0; height:30px; padding:0;"
onclick="setColor('#0000FF')"></button>

<button class="color" style="background:#87CEEB; flex:1; min-width:0; height:30px; padding:0;"
onclick="setColor('#87CEEB')"></button>

<button class="color" style="background:#800080; flex:1; min-width:0; height:30px; padding:0;"
onclick="setColor('#800080')"></button>

<button class="color" style="background:#8B4513; flex:1; min-width:0; height:30px; padding:0;"
onclick="setColor('#8B4513')"></button>

<button class="color" style="background:#000000; flex:1; min-width:0; height:30px; padding:0;"
onclick="setColor('#000000')"></button>

</div>


<br><br>

<button onclick="setSize(2)">ほそい</button>
<button onclick="setSize(4)">ちゅうくらい</button>
<button onclick="setSize(12)">ふとい</button>
<button onclick="setEraser()">けしゴム</button>
</div>

<br><br>

<canvas id="canvas" width="500" height="350"></canvas>

<br><br>

<button onclick="clearCanvas()">ぜんぶけす</button>
<button id="uploadButton" onclick="savePNG()">
さくひんをかざる
</button>

<p id="status" aria-live="polite"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://yapohmzbgojtaygfceel.supabase.co";
const SUPABASE_KEY = "sb_publishable_LzzA7XlGG4Q6qGQDpf8_mA_FZepVODX";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");
const uploadButton = document.getElementById("uploadButton");

// 絵を描ける範囲
const artArea = {
    left: 65,
    top: 55,
    right: 435,
    bottom: 295
};

let drawing = false;
let currentColor = "black";
let currentSize = 5;

// 額縁と台紙を描く
function drawFrame() {
    // 木製の額縁
    const wood = ctx.createLinearGradient(0, 0, 500, 350);
    wood.addColorStop(0, "#d9b47e");
    wood.addColorStop(0.5, "#a87543");
    wood.addColorStop(1, "#e2c18d");

ctx.fillStyle = wood;
ctx.fillRect(0, 0, 500, 350);

    // 額縁の内側の縁
    ctx.strokeStyle = "#80552f";
    ctx.lineWidth = 5;
    ctx.strokeRect(12, 12, 476, 326);

    // 白い台紙
    ctx.fillStyle = "#fffdf7";
    ctx.fillRect(45, 35, 410, 280);

    // 絵を描く白い部分
    ctx.fillStyle = "white";
    ctx.fillRect(
        artArea.left,
        artArea.top,
        artArea.right - artArea.left,
        artArea.bottom - artArea.top
    );

    // 描画範囲の細い境界線
    ctx.strokeStyle = "#ddd5c8";
    ctx.lineWidth = 1;
    ctx.strokeRect(
        artArea.left,
        artArea.top,
        artArea.right - artArea.left,
        artArea.bottom - artArea.top
    );
}

drawFrame();

function setColor(color) {
    currentColor = color;
    ctx.globalCompositeOperation = "source-over";
}

function setSize(size) {
    currentSize = size;
}

function setEraser() {
    currentColor = "white";
    ctx.globalCompositeOperation = "source-over";
}

function getPosition(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (e.clientX - rect.left) * canvas.width / rect.width,
        y: (e.clientY - rect.top) * canvas.height / rect.height
    };
}

function insideArt(p) {
    return p.x >= artArea.left &&
           p.x <= artArea.right &&
           p.y >= artArea.top &&
           p.y <= artArea.bottom;
}

canvas.addEventListener("pointerdown", function(e) {
    const p = getPosition(e);
    if (!insideArt(p)) return;

    drawing = true;
    canvas.setPointerCapture(e.pointerId);

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
});

canvas.addEventListener("pointermove", function(e) {
    if (!drawing) return;

    const p = getPosition(e);
    if (!insideArt(p)) return;

    ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentSize;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
});

canvas.addEventListener("pointerup", function() {
    drawing = false;
});

canvas.addEventListener("pointercancel", function() {
    drawing = false;
});

function clearCanvas() {
    ctx.clearRect(
        artArea.left,
        artArea.top,
        artArea.right - artArea.left,
        artArea.bottom - artArea.top
    );
    drawFrame();
}

// PNGを保存して美術館に展示
async function savePNG() {
    if (drawing) {
        status.textContent = "まずかいがをかきおえてね。";
        return;
    }

    uploadButton.disabled = true;
    status.textContent = "さくひんをかざっているよ……";

    try {
        const blob = await new Promise((resolve, reject) => {
            canvas.toBlob(result => {
                if (result) resolve(result);
                else reject(new Error("PNGへの変換に失敗しました"));
            }, "image/png");
        });

        const imagePath =
            "art-" + Date.now() + "-" +
            Math.random().toString(36).slice(2) + ".png";

        const { error: uploadError } = await supabaseClient
            .storage
            .from("art-images")
            .upload(imagePath, blob, {
                contentType: "image/png",
                upsert: false
            });

        if (uploadError) throw uploadError;

        const { error: rpcError } = await supabaseClient
            .rpc("add_art", {
                p_image_path: imagePath
            });

        if (rpcError) throw rpcError;

        status.textContent = "さくひんをかざったよ！";

        setTimeout(() => {
            location.href = "index.html";
        }, 1500);

    } catch (error) {
        console.error(error);
        status.textContent =
            "うまくはかざれなかったよ。もういちどためしてね。";
    } finally {
        if (status.textContent !== "さくひんをかざったよ！") {
            uploadButton.disabled = false;
        }
    }
}
</script>

</body>
</html>
